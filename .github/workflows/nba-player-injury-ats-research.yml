name: NBA player injury ATS research
on:
  push:
    branches:
      - sides-totals-rebuild
    paths:
      - "scripts/nba_player_injury_ats_experiment.py"
      - ".github/workflows/nba-player-injury-ats-research.yml"
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader
        run: python -m pip install 'duckdb>=1.2,<2'
      - name: Run leakage-safe player injury ATS experiment
        env:
          PYTHONPATH: .
        run: python scripts/nba_player_injury_ats_experiment.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: nba-player-injury-ats-research
          path: backtest-output/player_injury_ats_experiment/
          if-no-files-found: error
          retention-days: 90
