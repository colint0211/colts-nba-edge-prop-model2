name: Benter NBA research tests

on:
  push:
    branches:
      - research/benter-nba-clean
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Benter model tests
        run: python -m unittest discover -s tests -p "test_benter_model.py" -v
