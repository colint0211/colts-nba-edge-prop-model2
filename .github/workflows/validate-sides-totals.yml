name: Validate sides and totals rebuild

on:
  push:
    branches:
      - sides-totals-rebuild
  pull_request:
    branches:
      - main

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile API modules
        run: python -m compileall -q src/api
