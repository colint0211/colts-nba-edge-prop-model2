name: NBA market movement ATS holdout
on:
  push:
    branches:
      - sides-totals-rebuild
    paths:
      - "scripts/nba_market_movement_ats_holdout.py"
      - ".github/workflows/nba-market-movement-ats-holdout.yml"
  workflow_dispatch:
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen market movement holdout
        env:
          PYTHONPATH: .
        run: python scripts/nba_market_movement_ats_holdout.py
      - name: Upload holdout report
        uses: actions/upload-artifact@v4
        with:
          name: nba-market-movement-ats-holdout
          path: backtest-output/market_movement_ats_holdout/
          if-no-files-found: error
          retention-days: 90
