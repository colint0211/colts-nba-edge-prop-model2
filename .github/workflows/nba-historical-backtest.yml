name: NBA full-game totals walk-forward validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches:
      - feature/nba-stats-off-def-primary
    paths:
      - src/api/game_model.py
      - src/api/nba_totals.py
      - src/api/nba_totals_backtest.py
      - src/api/totals.html
      - src/api/index.py
      - tests/test_nba_totals.py
      - tests/test_nba_totals_backtest.py
      - tests/test_game_model_player_impact.py
      - requirements.txt
      - pyproject.toml
      - .github/workflows/nba-historical-backtest.yml

permissions:
  contents: write

concurrency:
  group: nba-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/nba-stats-off-def-primary
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install model and backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application modules
        run: python -m compileall -q src

      - name: Test injury impact matching and safety gates
        run: python -m unittest discover -s tests -v

      - name: Run season-to-date NBA totals walk-forward validation
        run: python -m src.api.nba_totals_backtest

      - name: Publish training-only NBA totals calibration snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open("nba_totals_backtest.json", encoding="utf-8") as source:
              payload = json.load(source)
          payload["generated_at"] = datetime.now(timezone.utc).isoformat()
          with open("data/nba_totals_backtest.json", "w", encoding="utf-8") as output:
              json.dump(payload, output, indent=2, allow_nan=False)
              output.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_totals_backtest.json
          if git diff --cached --quiet; then
            echo "NBA totals calibration snapshot is unchanged."
          else
            git commit -m "Publish NBA totals walk-forward calibration"
            git push origin HEAD:feature/nba-stats-off-def-primary
          fi

      - name: Save NBA totals validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: nba-totals-walk-forward-results
          path: |
            nba_totals_backtest.json
            data/nba_totals_backtest.json
          if-no-files-found: error
          retention-days: 30
