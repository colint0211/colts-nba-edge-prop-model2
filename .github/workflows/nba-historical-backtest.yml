name: NBA historical walk-forward backtest

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nba-stats-off-def-primary
    paths:
      - src/api/nba_historical_backtest.py
      - src/api/nba_live_aligned_backtest.py
      - .github/workflows/nba-historical-backtest.yml
      - requirements.txt
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: nba-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/nba-stats-off-def-primary
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install model and backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run leakage-safe historical backtest
        run: |
          python - <<'PY'
          from src.api.nba_historical_backtest import run
          result = run(persist=False)
          print("BACKTEST_RESULT=" + __import__("json").dumps({
              "success": result["success"],
              "games_scored": result["games_scored"],
              "date_range": result["date_range"],
              "metrics": result["metrics"],
              "limitations": result["limitations"],
          }, sort_keys=True))
          PY

      - name: Run production-formula-aligned walk-forward validation
        run: python -m src.api.nba_live_aligned_backtest

      - name: Save backtest results
        uses: actions/upload-artifact@v4
        with:
          name: nba-historical-backtest-results
          path: |
            backtest_results.json
            nba_live_aligned_backtest.json
          if-no-files-found: error
          retention-days: 30
