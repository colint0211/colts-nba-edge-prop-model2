name: NBA historical walk-forward backtest

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nba-stats-off-def-primary
    paths:
      - src/api/nba_historical_backtest.py
      - .github/workflows/nba-historical-backtest.yml
      - requirements.txt
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: nba-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/nba-stats-off-def-primary
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install model and backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate required database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub repository secret DATABASE_URL is missing."
            exit 1
          fi
      - name: Run leakage-safe historical backtest
        run: |
          python - <<'PY'
          from src.api.nba_historical_backtest import run
          result = run()
          print("BACKTEST_RESULT=" + __import__("json").dumps({
              "success": result["success"],
              "games_scored": result["games_scored"],
              "date_range": result["date_range"],
              "metrics": result["metrics"],
              "limitations": result["limitations"],
          }, sort_keys=True))
          PY
