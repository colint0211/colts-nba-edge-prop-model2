name: NBA historical walk-forward backtest

on:
  workflow_dispatch:
  push:
    branches:
      - feature/nba-stats-off-def-primary
    paths:
      - src/api/nba_historical_backtest.py
      - src/api/nba_live_aligned_backtest.py
      - src/api/nba_historical_ats_backtest.py
      - src/api/nba_free_ats_backtest.py
      - src/api/game_model.py
      - src/api/nba_totals.py
      - src/api/totals.html
      - src/api/index.py
      - tests/test_nba_totals.py
      - src/api/prediction_ledger.py
      - tests/test_game_model_player_impact.py
      - tests/test_historical_ats_backtest.py
      - tests/test_free_ats_backtest.py
      - tests/test_propline_draftkings_only.py
      - tests/test_daily_slate_audit.py
      - .github/workflows/nba-historical-backtest.yml
      - requirements.txt
      - pyproject.toml

permissions:
  contents: write

concurrency:
  group: nba-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/nba-stats-off-def-primary
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install model and backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application modules
        run: python -m compileall -q src

      - name: Test injury impact matching and safety gates
        run: python -m unittest discover -s tests -v

      - name: Run leakage-safe historical backtest
        run: |
          python - <<'PY'
          from src.api.nba_historical_backtest import run
          result = run(persist=False)
          print("BACKTEST_RESULT=" + __import__("json").dumps({
              "success": result["success"],
              "games_scored": result["games_scored"],
              "date_range": result["date_range"],
              "metrics": result["metrics"],
              "limitations": result["limitations"],
          }, sort_keys=True))
          PY

      - name: Run production-formula-aligned walk-forward validation
        run: python -m src.api.nba_live_aligned_backtest

      - name: Publish training-only NBA totals calibration snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open("nba_live_aligned_backtest.json", encoding="utf-8") as source:
              payload = json.load(source)
          payload["generated_at"] = datetime.now(timezone.utc).isoformat()
          with open("data/nba_totals_backtest.json", "w", encoding="utf-8") as output:
              json.dump(payload, output, indent=2, allow_nan=False)
              output.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_totals_backtest.json
          if git diff --cached --quiet; then
            echo "NBA totals calibration snapshot is unchanged."
          else
            git commit -m "Publish NBA totals walk-forward calibration"
            git push origin HEAD:feature/nba-stats-off-def-primary
          fi

      - name: Run zero-cost free-sample closing-spread validation
        run: python -m src.api.nba_free_ats_backtest

      - name: Save backtest results
        uses: actions/upload-artifact@v4
        with:
          name: nba-historical-backtest-results
          path: |
            backtest_results.json
            nba_live_aligned_backtest.json
            data/nba_totals_backtest.json
            nba_free_ats_backtest.json
          if-no-files-found: error
          retention-days: 30
