name: NBA automation validation

on:
  push:
    branches:
      - research/ats-feature-study
      - audit/game-model-root-cause
  pull_request:
    branches:
      - research/ats-feature-study
      - audit/game-model-root-cause
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-tracker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile src/api/index.py src/api/prediction_ledger.py src/api/slate_validation.py src/api/game_model.py src/api/quant_game_engine.py src/api/advanced_metrics.py scripts/betting_performance_tracker.py
      - name: Run tracker regression tests
        run: python -m unittest tests.test_nba_settlement tests.test_betting_performance_tracker tests.test_game_model_probabilities -v
