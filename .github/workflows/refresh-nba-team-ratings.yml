name: Refresh Basketball-Reference NBA team ratings (preview)

on:
# The schedule runs from the default branch; the preview-branch push trigger below enables free refreshes before promotion.
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - feature/nba-stats-off-def-primary
    paths:
      - scripts/refresh_nba_team_ratings.py
      - .github/workflows/refresh-nba-team-ratings.yml

permissions:
  contents: write

concurrency:
  group: official-nba-team-ratings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out model branch
        uses: actions/checkout@v4
        with:
          ref: feature/nba-stats-off-def-primary
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Basketball-Reference parser
        run: python -m pip install --upgrade pip pandas lxml requests
      - name: Fetch and validate Basketball-Reference team ratings
        run: python scripts/refresh_nba_team_ratings.py
      - name: Publish validated ratings snapshot to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_team_advanced.json
          if git diff --cached --quiet; then
            echo "Official NBA Stats snapshot is unchanged."
          else
            git commit -m "Refresh official NBA Advanced team ratings"
            git push origin HEAD:feature/nba-stats-off-def-primary
          fi
